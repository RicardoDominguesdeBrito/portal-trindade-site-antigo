<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Portal Trindade mudou de endereço</title>
  <meta name="description" content="O Portal Trindade está em um novo endereço. Acesse www.trindadeportal.com.br.">
  <link rel="canonical" href="https://www.trindadeportal.com.br/">
  <style>
    :root {
      --azul: #0d1f4c;
      --azul-claro: #17386f;
      --dourado: #c9a84c;
      --dourado-claro: #ecd98f;
      --branco: #ffffff;
      --cinza: #b9c1d1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 15%, rgba(201, 168, 76, 0.16), transparent 30%),
        linear-gradient(145deg, #030509, #081227 58%, #0d1f4c);
    }

    .card {
      width: min(760px, 100%);
      overflow: hidden;
      border: 1px solid rgba(201, 168, 76, 0.62);
      border-radius: 26px;
      background: rgba(3, 6, 13, 0.90);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.50);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .faixa {
      height: 7px;
      background: linear-gradient(90deg, transparent, var(--dourado), var(--dourado-claro), var(--dourado), transparent);
    }

    .conteudo { padding: 34px 42px 42px; }

    .logo {
      display: block;
      width: min(480px, 100%);
      height: auto;
      margin: 0 auto 8px;
      border-radius: 16px;
    }

    .divisor {
      width: 92px;
      height: 2px;
      margin: 4px auto 26px;
      background: linear-gradient(90deg, transparent, var(--dourado), transparent);
    }

    h1 {
      margin-bottom: 14px;
      color: var(--branco);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2rem, 6vw, 3.35rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .introducao {
      max-width: 590px;
      margin: 0 auto 26px;
      color: #d9deea;
      font-size: 1.06rem;
      line-height: 1.65;
    }

    .endereco {
      display: block;
      margin-top: 10px;
      color: var(--dourado-claro);
      font-size: clamp(1.22rem, 4vw, 1.72rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 15px 30px;
      border: 1px solid var(--dourado);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--dourado), #e1c66d);
      color: #071329;
      font-size: 0.96rem;
      font-weight: 900;
      letter-spacing: 0.045em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(201, 168, 76, 0.20);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .botao:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(201, 168, 76, 0.30);
    }

    .rodape {
      padding: 20px 24px;
      border-top: 1px solid rgba(201, 168, 76, 0.24);
      color: var(--cinza);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      background: rgba(255,255,255,0.02);
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .conteudo { padding: 25px 20px 32px; }
      .logo { width: 100%; }
      .botao { width: 100%; }
    }
  </style>
</head>
