<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Portal Trindade mudou de endereço</title>
  <meta name="description" content="O Portal Trindade está em um novo endereço. Acesse www.trindadeportal.com.br.">
  <link rel="canonical" href="https://www.trindadeportal.com.br/">
  <style>
    :root {
      --azul: #0d1f4c;
      --azul-claro: #17386f;
      --dourado: #c9a84c;
      --dourado-claro: #ecd98f;
      --branco: #ffffff;
      --cinza: #c7ceda;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 10%, rgba(201,168,76,.18), transparent 32%),
        linear-gradient(145deg, #02040a, #0a1630 55%, #061024);
      color: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(760px, 100%);
      overflow: hidden;
      border: 1px solid rgba(201,168,76,.58);
      border-radius: 24px;
      background: rgba(5,14,32,.92);
      box-shadow: 0 28px 80px rgba(0,0,0,.46);
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .faixa {
      height: 8px;
      background: linear-gradient(90deg, var(--azul), var(--dourado), var(--azul));
    }
    .conteudo { padding: 34px 42px 44px; }
    .logo {
      display: block;
      width: min(520px, 100%);
      height: auto;
      margin: 0 auto 26px;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,.28);
    }
    h1 {
      margin-bottom: 16px;
      color: var(--dourado-claro);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2rem, 6vw, 3.35rem);
      line-height: 1.08;
    }
    .introducao {
      max-width: 570px;
      margin: 0 auto 26px;
      color: var(--cinza);
      font-size: 1.08rem;
      line-height: 1.7;
    }
    .endereco {
      display: block;
      margin-top: 10px;
      color: var(--branco);
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 15px 30px;
      border: 1px solid var(--dourado);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--dourado), #e1c66d);
      color: #071329;
      font-size: .96rem;
      font-weight: 900;
      letter-spacing: .045em;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(201,168,76,.20);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .botao:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(201,168,76,.30);
    }
    .rodape {
      padding: 20px 24px;
      border-top: 1px solid rgba(201,168,76,.24);
      color: var(--cinza);
      font-size: .82rem;
      letter-spacing: .02em;
      background: rgba(255,255,255,.02);
    }
    @media (max-width: 560px) {
      body { padding: 14px; }
      .conteudo { padding: 24px 20px 32px; }
      .botao { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="faixa"></div>
    <section class="conteudo">
      <img class="logo" src="./WhatsApp%20Image%202026-06-28%20at%2014.36.54%20(1).jpeg" alt="Logotipo do Portal Trindade">
      <h1>Estamos em um novo endereço</h1>
      <p class="introducao">
        O site do Portal Trindade agora está disponível em:
        <strong class="endereco">www.trindadeportal.com.br</strong>
      </p>
      <a class="botao" href="https://www.trindadeportal.com.br/" rel="noopener">Acessar o novo site</a>
    </section>
    <footer class="rodape">Portal Trindade · Turismo, fé, cultura e comércio local</footer>
  </main>
</body>
</html>
